<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A calm workspace in layers</title>
  <desc id="desc">Three soft neutral panels overlap around one blue accent line and a small blue marker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F7F9"/>
      <stop offset="1" stop-color="#EFEFF4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <rect x="130" y="120" width="720" height="520" rx="32" fill="#FFFFFF"/>
    <rect x="300" y="190" width="720" height="470" rx="32" fill="#FAFAFC"/>
  </g>
  <rect x="350" y="250" width="260" height="18" rx="9" fill="#D8D8DE"/>
  <rect x="350" y="292" width="460" height="14" rx="7" fill="#E6E6EB"/>
  <rect x="350" y="326" width="390" height="14" rx="7" fill="#E6E6EB"/>
  <rect x="350" y="390" width="520" height="1" fill="#D8D8DE"/>
  <rect x="350" y="440" width="160" height="14" rx="7" fill="#E6E6EB"/>
  <rect x="350" y="474" width="300" height="14" rx="7" fill="#E6E6EB"/>
  <rect x="350" y="548" width="210" height="44" rx="12" fill="#007AFF"/>
  <circle cx="890" cy="262" r="16" fill="#007AFF"/>
</svg>
